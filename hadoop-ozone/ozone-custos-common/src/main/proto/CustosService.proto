/**
 * These .proto interfaces are private and unstable.
 * Please see http://wiki.apache.org/hadoop/Compatibility
 * for what changes are allowed for a *unstable* .proto interface.
 */

syntax = "proto3";
option java_package = "org.apache.hadoop.ozone.custos.proto";
option java_outer_classname = "CustosServiceProtos";
option java_generic_services = true;
option java_generate_equals_and_hash = true;
package hadoop.ozone.custos;

import "CustosToken.proto";

message GetSessionTokenRequest {
  CustosCredentialProto credential = 1;
  /** Requested session TTL in milliseconds. */
  uint64 requestedTtlMs = 2;
  /** OM cluster / service id this token must be valid for. */
  string audience = 3;
  // Fingerprint (from a prior response's ca_fingerprint) of the CA bundle the
  // client already holds. When it matches Custos's current bundle, the response
  // omits ca_cert_pem and sets ca_unchanged, saving the re-send. Bandwidth only;
  // not a security control (see README: trust bootstrap).
  string known_ca_fingerprint = 4;
}

message GetSessionTokenResponse {
  CustosTokenProto token = 1;
  // Cluster CA certificate(s) (PEM), returned only to authenticated callers so
  // the client can establish TLS to OM without fetching the trust anchor out of
  // band. Root first, then the SCM CA if distinct. Omitted when ca_unchanged is
  // true (client's known_ca_fingerprint already matched).
  repeated string ca_cert_pem = 2;
  // True when the client's known_ca_fingerprint matched the current bundle, so
  // ca_cert_pem is intentionally empty and the client should reuse its cached
  // CA. Distinguishes "reuse yours" from "Custos has no CA" (both empty list).
  bool ca_unchanged = 3;
  // Fingerprint of Custos's current CA bundle (opaque; echo it back in a later
  // request's known_ca_fingerprint). Empty when Custos holds no CA.
  string ca_fingerprint = 4;
}

message RenewSessionTokenRequest {
  CustosTokenProto token = 1;
  /** Requested extension to expiryMs, in milliseconds from now. */
  uint64 requestedTtlMs = 2;
}

message RenewSessionTokenResponse {
  CustosTokenProto token = 1;
}

/**
 * Custos authentication service. Clients exchange a credential for a signed
 * session-scoped CustosToken; OM verifies the token locally on each request.
 */
service CustosService {
  rpc GetSessionToken(GetSessionTokenRequest)
      returns (GetSessionTokenResponse);
  rpc RenewSessionToken(RenewSessionTokenRequest)
      returns (RenewSessionTokenResponse);
}
